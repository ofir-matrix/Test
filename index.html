<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Hosted Web App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 GitHub Hosted Web App</h1>
            <p class="subtitle">Successfully deployed via GitHub Pages</p>
        </header>
        
        <main>
            <div class="card">
                <h2>Welcome!</h2>
                <p>This web application is hosted on GitHub Pages.</p>
                <button id="interactiveBtn" class="btn">Click Me!</button>
                <p id="message" class="message"></p>
            </div>
            
            <div class="card">
                <h2>Repository Info</h2>
                <p><strong>Repository:</strong> <a href="https://github.com/ofir-matrix/Test" target="_blank">ofir-matrix/Test</a></p>
                <p><strong>Hosted URL:</strong> <a href="https://ofir-matrix.github.io/Test/" target="_blank">https://ofir-matrix.github.io/Test/</a></p>
            </div>
        </main>
        
        <footer>
            <p>Powered by GitHub Pages</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
